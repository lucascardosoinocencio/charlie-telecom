<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0a0b0d;
    overflow: hidden;
    font-family: "Manrope", sans-serif;
  }
  .glow-red {
    position: absolute;
    top: -220px;
    right: -160px;
    width: 640px;
    height: 640px;
    border-radius: 999px;
    background: rgba(226, 31, 38, 0.28);
    filter: blur(140px);
  }
  .glow-white {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 16% 18%, rgba(255,255,255,0.07), transparent 45%);
  }
  .wrap {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 72px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand img {
    height: 56px;
    width: auto;
  }
  .brand span {
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: #ffffff;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #d8dade;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #e21f26;
  }
  h1 {
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 1.08;
    color: #ffffff;
    max-width: 900px;
    margin-top: 26px;
  }
  h1 .accent { color: #ec4b47; }
  p.sub {
    margin-top: 22px;
    font-size: 24px;
    font-weight: 500;
    color: #b3b8bf;
    max-width: 760px;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .services {
    display: flex;
    gap: 14px;
  }
  .services span {
    font-size: 17px;
    font-weight: 600;
    color: #eceef0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 18px;
    border-radius: 12px;
  }
  .url {
    font-family: "Sora", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    background: #e21f26;
    padding: 14px 26px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow-red"></div>
    <div class="glow-white"></div>

    <div style="position: relative; display:flex; flex-direction:column;">
      <div class="brand">
        <img src="ICON_SRC" alt="" />
        <span>CHARLIE TELECOM</span>
      </div>

      <div class="badge" style="margin-top: 44px;">
        <span class="dot"></span>
        27 anos protegendo Bauru e Região
      </div>

      <h1>Segurança eletrônica <span class="accent">de verdade</span>, instalada por quem faz isso desde 1998.</h1>

      <p class="sub">Câmeras, alarme, automação de portão e rede, com as marcas líderes do mercado.</p>
    </div>

    <div class="bottom" style="position: relative;">
      <div class="services">
        <span>CFTV</span>
        <span>Alarme</span>
        <span>Portão</span>
        <span>Redes</span>
      </div>
      <div class="url">charlietelecom.com.br</div>
    </div>
  </div>
</body>
</html>
